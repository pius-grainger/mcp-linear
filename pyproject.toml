[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-linear"
version = "0.1.0"
description = "MCP server exposing Linear issue operations"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
]

[project.scripts]
mcp-linear = "mcp_linear.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_linear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
